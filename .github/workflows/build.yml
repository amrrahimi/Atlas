name: Build native Windows and macOS apps
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            id: windows
          - os: macos-15
            id: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Test research engine
        run: python -m pytest -q
      - name: Package native desktop program
        run: python -m PyInstaller --noconfirm --windowed --name AtlasTrader --collect-all pyqtgraph --collect-all ccxt --paths src launcher.py
      - name: Zip Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/AtlasTrader -DestinationPath dist/AtlasTrader-Windows.zip
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: hdiutil create -volname AtlasTrader -srcfolder dist/AtlasTrader.app -ov -format UDZO dist/AtlasTrader-macOS.dmg
      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AtlasTrader-Windows
          path: dist/AtlasTrader-Windows.zip
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AtlasTrader-macOS
          path: dist/AtlasTrader-macOS.dmg
