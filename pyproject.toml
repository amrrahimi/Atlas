[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trader-desktop"
version = "0.1.0"
description = "Native crypto analytics & paper-trading desktop application"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<1", "numpy>=2.0,<3", "ccxt>=4.4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
